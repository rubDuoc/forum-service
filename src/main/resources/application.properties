spring.application.name=forum-service
# Puerto: en el Cloud (Render) se recibe en la variable PORT
server.port=${PORT:8084}

# Oracle Autonomous Database (Oracle Cloud) con wallet
# TNS_ADMIN = carpeta del wallet (local: ./wallet, Render: /etc/secrets)
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICE:bdfullstack3_low}?TNS_ADMIN=${TNS_ADMIN:./wallet}
spring.datasource.username=${DB_USERNAME:ADMIN}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate: las tablas se crean con el script de src/main/resources/db
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# CORS: origenes del frontend separados por coma
cors.origenes-permitidos=${CORS_ORIGENES:http://localhost:4200}

# Logging
logging.level.root=INFO
logging.level.com.foro=DEBUG
